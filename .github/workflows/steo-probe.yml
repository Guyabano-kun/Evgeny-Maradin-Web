name: STEO probe (temporary)
on:
  push:
    branches: [claude/production-to-sep]
    paths: [tools/steo_probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/steo_probe.py steo-probe.json
      - run: |
          git add steo-probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "STEO probe output" && git push
